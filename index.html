<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A* Pathfinding Visualizer</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for grid appearance and responsiveness */
        #gridCanvas {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.06);
            cursor: pointer;
            border-radius: 0.5rem;
            max-width: 100%; /* Ensure responsiveness */
        }
        /* Custom cursor for drawing walls */
        .drawing-cursor {
            cursor: crosshair;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center p-4 font-sans">

    <div class="w-full max-w-4xl text-center">
        <h1 class="text-3xl font-extrabold text-blue-800 mb-2">A* Pathfinding Visualizer</h1>
        <p class="text-gray-600 mb-6">Click/Drag on the grid to add walls. Set Start (S) and End (E) nodes, then click "Run A*" to see the optimized path.</p>
    </div>

    <div id="controls" class="w-full max-w-4xl bg-white p-4 rounded-xl shadow-lg mb-6 flex flex-col sm:flex-row justify-center items-center space-y-3 sm:space-y-0 sm:space-x-4">
        <button id="runButton" class="w-full sm:w-auto px-6 py-2 bg-green-600 text-white font-semibold rounded-lg shadow-md hover:bg-green-700 transition duration-150 disabled:opacity-50" onclick="startAStar()">Run A*</button>
        <button class="w-full sm:w-auto px-6 py-2 bg-indigo-600 text-white font-semibold rounded-lg shadow-md hover:bg-indigo-700 transition duration-150" onclick="setMode('start')">Set Start (S)</button>
        <button class="w-full sm:w-auto px-6 py-2 bg-red-600 text-white font-semibold rounded-lg shadow-md hover:bg-red-700 transition duration-150" onclick="setMode('end')">Set End (E)</button>
        <button class="w-full sm:w-auto px-6 py-2 bg-gray-300 text-gray-800 font-semibold rounded-lg shadow-md hover:bg-gray-400 transition duration-150" onclick="resetGrid()">Clear Grid</button>
        <span id="statusMessage" class="text-sm font-medium text-gray-500 hidden sm:inline-block">Mode: Wall Drawing</span>
    </div>

    <div class="w-full max-w-4xl flex justify-center">
        <canvas id="gridCanvas"></canvas>
    </div>

    <script>
        // --- Configuration ---
        const ROWS = 25;
        const COLS = 40;
        const CELL_SIZE = 20; // Size in pixels
        const ANIMATION_SPEED = 20; // ms delay per step

        // --- State Variables ---
        let grid = [];
        let startNode = null;
        let endNode = null;
        let currentMode = 'wall'; // 'wall', 'start', 'end'
        let isRunning = false;
        let isDrawing = false; // For click-and-drag wall creation
        let canvas, ctx;
        let animationFrameId;

        // --- Min-Heap (Priority Queue) Implementation for O(log N) extraction ---
        class MinPriorityQueue {
            // Compares nodes based on their f-cost (f = g + h)
            constructor(comparator = (a, b) => a.f - b.f) {
                this._heap = [];
                this._comparator = comparator;
            }

            size() { return this._heap.length; }
            isEmpty() { return this.size() === 0; }

            insert(value) {
                this._heap.push(value);
                this._siftUp();
            }

            extractMin() {
                if (this.isEmpty()) return undefined;
                if (this.size() === 1) return this._heap.pop();
                const min = this._heap[0];
                this._heap[0] = this._heap.pop();
                this._siftDown();
                return min;
            }

            // Move the last element up to maintain the heap property
            _siftUp() {
                let nodeIndex = this.size() - 1;
                while (nodeIndex > 0) {
                    let parentIndex = Math.floor((nodeIndex - 1) / 2);
                    // If the child is smaller than the parent, swap them
                    if (this._comparator(this._heap[nodeIndex], this._heap[parentIndex]) < 0) {
                        [this._heap[nodeIndex], this._heap[parentIndex]] = [this._heap[parentIndex], this._heap[nodeIndex]];
                        nodeIndex = parentIndex;
                    } else {
                        break;
                    }
                }
            }

            // Move the root element down to its correct position
            _siftDown() {
                let nodeIndex = 0;
                let lastIndex = this.size() - 1;
                while (true) {
                    let leftChildIndex = nodeIndex * 2 + 1;
                    let rightChildIndex = nodeIndex * 2 + 2;
                    let swapIndex = nodeIndex;

                    // Compare with left child
                    if (leftChildIndex <= lastIndex && this._comparator(this._heap[leftChildIndex], this._heap[swapIndex]) < 0) {
                        swapIndex = leftChildIndex;
                    }

                    // Compare with right child
                    if (rightChildIndex <= lastIndex && this._comparator(this._heap[rightChildIndex], this._heap[swapIndex]) < 0) {
                        swapIndex = rightChildIndex;
                    }

                    if (swapIndex !== nodeIndex) {
                        [this._heap[nodeIndex], this._heap[swapIndex]] = [this._heap[swapIndex], this._heap[nodeIndex]];
                        nodeIndex = swapIndex;
                    } else {
                        break;
                    }
                }
            }
        }


        // --- Node Class Definition (The core data structure) ---
        class Node {
            constructor(row, col) {
                this.row = row;
                this.col = col;
                this.isWall = false;
                this.isStart = false;
                this.isEnd = false;
                this.visited = false;
                this.inPath = false;

                // A* specific properties
                this.f = Infinity; // f = g + h
                this.g = Infinity; // Cost from start to current node
                this.h = Infinity; // Heuristic cost from current node to end
                this.parent = null;
            }
        }

        // --- Initialization ---

        window.onload = function() {
            canvas = document.getElementById('gridCanvas');
            ctx = canvas.getContext('2d');
            setupCanvas();
            createGrid();
            drawGrid();

            // Set up event listeners for user interaction
            canvas.addEventListener('mousedown', handleMouseDown);
            canvas.addEventListener('mousemove', handleMouseMove);
            canvas.addEventListener('mouseup', handleMouseUp);
            canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
            canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
            canvas.addEventListener('touchend', handleMouseUp); // Use mouseUp for touchend
            window.addEventListener('resize', setupCanvas);
        };

        function setupCanvas() {
            // Calculate canvas size based on container width for responsiveness
            const containerWidth = document.querySelector('.max-w-4xl').clientWidth;
            // Calculate best cell size based on current container width
            const calculatedCellSize = Math.floor(containerWidth / COLS);

            canvas.width = COLS * calculatedCellSize;
            canvas.height = ROWS * calculatedCellSize;

            // Recalculate size constants for drawing functions
            canvas.cellSize = calculatedCellSize;

            if (grid.length > 0) {
                drawGrid();
            }
        }

        function createGrid() {
            grid = [];
            for (let r = 0; r < ROWS; r++) {
                grid[r] = [];
                for (let c = 0; c < COLS; c++) {
                    grid[r][c] = new Node(r, c);
                }
            }
            // Set default start and end points
            startNode = grid[Math.floor(ROWS / 2)][Math.floor(COLS / 4)];
            startNode.isStart = true;
            endNode = grid[Math.floor(ROWS / 2)][Math.floor(COLS / 4 * 3)];
            endNode.isEnd = true;
        }

        // --- Drawing Functions ---

        function drawGrid() {
            const cellSize = canvas.cellSize;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const node = grid[r][c];
                    const x = c * cellSize;
                    const y = r * cellSize;

                    // Set fill color based on node state
                    let color = 'white';
                    if (node.isWall) color = '#374151'; // Dark gray
                    else if (node.inPath) color = '#FBBF24'; // Amber (Path)
                    else if (node.isStart) color = '#10B981'; // Green (Start)
                    else if (node.isEnd) color = '#EF4444'; // Red (End)
                    else if (node.visited) color = '#BFDBFE'; // Light blue (Visited)

                    ctx.fillStyle = color;
                    ctx.fillRect(x, y, cellSize, cellSize);

                    // Draw grid lines
                    ctx.strokeStyle = '#E5E7EB'; // Light gray
                    ctx.strokeRect(x, y, cellSize, cellSize);

                    // Add markers for Start/End
                    if (node.isStart) drawText(x, y, cellSize, 'S', 'white');
                    if (node.isEnd) drawText(x, y, cellSize, 'E', 'white');
                }
            }
        }

        function drawText(x, y, size, text, color) {
            ctx.fillStyle = color;
            ctx.font = `${size * 0.6}px Inter`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, x + size / 2, y + size / 2);
        }

        // --- User Interaction ---

        function getMousePos(event) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            let clientX, clientY;
            if (event.touches) {
                clientX = event.touches[0].clientX;
                clientY = event.touches[0].clientY;
            } else {
                clientX = event.clientX;
                clientY = event.clientY;
            }

            const canvasX = (clientX - rect.left) * scaleX;
            const canvasY = (clientY - rect.top) * scaleY;

            const r = Math.floor(canvasY / canvas.cellSize);
            const c = Math.floor(canvasX / canvas.cellSize);
            return { r, c };
        }

        function handleCellClick(r, c) {
            if (r < 0 || r >= ROWS || c < 0 || c >= COLS || isRunning) return;

            const node = grid[r][c];

            // Reset start/end status if this node was previously one
            if (node.isStart && currentMode !== 'start') startNode = null;
            if (node.isEnd && currentMode !== 'end') endNode = null;

            if (currentMode === 'wall') {
                if (!node.isStart && !node.isEnd) {
                    node.isWall = !node.isWall;
                }
            } else if (currentMode === 'start') {
                if (startNode) startNode.isStart = false; // Clear old start
                node.isStart = true;
                node.isWall = false;
                startNode = node;
                setMode('wall'); // Go back to wall drawing
            } else if (currentMode === 'end') {
                if (endNode) endNode.isEnd = false; // Clear old end
                node.isEnd = true;
                node.isWall = false;
                endNode = node;
                setMode('wall'); // Go back to wall drawing
            }

            drawGrid();
        }

        function handleMouseDown(event) {
            if (currentMode === 'wall' && !isRunning) {
                isDrawing = true;
                handleCellClick(getMousePos(event).r, getMousePos(event).c);
            }
        }

        function handleMouseMove(event) {
            if (isDrawing && currentMode === 'wall' && !isRunning) {
                handleCellClick(getMousePos(event).r, getMousePos(event).c);
            }
        }
        
        function handleTouchStart(event) {
            event.preventDefault(); // Prevent scrolling
            if (currentMode === 'wall' && !isRunning) {
                isDrawing = true;
                handleCellClick(getMousePos(event).r, getMousePos(event).c);
            } else {
                 handleCellClick(getMousePos(event).r, getMousePos(event).c);
            }
        }

        function handleTouchMove(event) {
            event.preventDefault(); // Prevent scrolling
            if (isDrawing && currentMode === 'wall' && !isRunning) {
                 handleCellClick(getMousePos(event).r, getMousePos(event).c);
            }
        }

        function handleMouseUp() {
            isDrawing = false;
        }

        function setMode(mode) {
            if (isRunning) return;
            currentMode = mode;
            const status = document.getElementById('statusMessage');
            let cursor = '';

            if (mode === 'wall') {
                status.textContent = 'Mode: Wall Drawing (Click/Drag)';
                cursor = 'crosshair';
            } else if (mode === 'start') {
                status.textContent = 'Mode: Setting Start Node (S)';
                cursor = 'pointer';
            } else if (mode === 'end') {
                status.textContent = 'Mode: Setting End Node (E)';
                cursor = 'pointer';
            }
            // Update cursor style
            canvas.style.cursor = cursor;
        }

        function resetGrid() {
            if (isRunning) return;
            createGrid(); // Re-initialize all nodes
            drawGrid();
            document.getElementById('runButton').disabled = false;
            isRunning = false;
            setMode('wall');
            document.getElementById('statusMessage').textContent = 'Grid Cleared. Ready.';
        }

        // --- A* Algorithm Implementation (Now with Diagonal Movement) ---

        // Heuristic function: Euclidean Distance (appropriate for 8-direction movement)
        function heuristic(nodeA, nodeB) {
            const dx = Math.abs(nodeA.row - nodeB.row);
            const dy = Math.abs(nodeA.col - nodeB.col);
            // H = sqrt(dx^2 + dy^2)
            return Math.sqrt(dx * dx + dy * dy); 
        }

        // Finds valid neighbors (now checking all 8 directions)
        function getNeighbors(node) {
            const neighbors = [];
            const r = node.row;
            const c = node.col;

            // Directions: 8 directions (Cardinal and Diagonal)
            const directions = [
                [0, 1], [0, -1], [1, 0], [-1, 0], // Cardinal
                [1, 1], [1, -1], [-1, 1], [-1, -1] // Diagonal
            ];

            for (const [dr, dc] of directions) {
                const newR = r + dr;
                const newC = c + dc;

                if (newR >= 0 && newR < ROWS && newC >= 0 && newC < COLS) {
                    const neighbor = grid[newR][newC];
                    if (!neighbor.isWall) {
                        neighbors.push(neighbor);
                    }
                }
            }
            return neighbors;
        }

        // Reconstructs the path from the end node back to the start
        function reconstructPath() {
            let currentNode = endNode;
            while (currentNode.parent) {
                currentNode.inPath = true;
                currentNode = currentNode.parent;
            }
        }

        async function aStar(start, end) {
            // Use the optimized MinPriorityQueue for O(log N) extraction
            const openSet = new MinPriorityQueue();
            let nodesExplored = 0;
            
            const startTime = performance.now(); // Start performance measurement

            // Reset costs for a fresh run
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const node = grid[r][c];
                    node.f = Infinity;
                    node.g = Infinity;
                    node.h = Infinity;
                    node.parent = null;
                    node.visited = false;
                    node.inPath = false;
                }
            }

            // Start node initialization
            start.g = 0;
            start.h = heuristic(start, end);
            start.f = start.g + start.h;
            openSet.insert(start);
            
            let found = false;

            while (!openSet.isEmpty()) {
                const currentNode = openSet.extractMin();
                
                // If a node has already been visited/processed, skip (handles updating costs in the heap)
                if (currentNode.visited) continue;
                
                nodesExplored++;
                currentNode.visited = true;

                // Found the path
                if (currentNode === end) {
                    reconstructPath();
                    found = true;
                    break;
                }

                // Animate the step (non-blocking delay)
                drawGrid();
                await new Promise(resolve => setTimeout(resolve, ANIMATION_SPEED));

                const neighbors = getNeighbors(currentNode);

                for (const neighbor of neighbors) {
                    if (neighbor.visited || neighbor.isWall) {
                        continue;
                    }

                    // Calculate the step cost: 1 for cardinal, Math.SQRT2 (~1.414) for diagonal
                    const isDiagonal = (neighbor.row !== currentNode.row) && (neighbor.col !== currentNode.col);
                    const stepCost = isDiagonal ? Math.SQRT2 : 1;
                    
                    // Tentative g cost is the cost to current node + stepCost
                    const tentative_g = currentNode.g + stepCost;

                    if (tentative_g < neighbor.g) {
                        // This path to neighbor is better. Record it.
                        neighbor.parent = currentNode;
                        neighbor.g = tentative_g;
                        neighbor.h = heuristic(neighbor, end);
                        neighbor.f = neighbor.g + neighbor.h;

                        // Insert or update the node in the open set
                        openSet.insert(neighbor);
                    }
                }
            }
            
            const endTime = performance.now(); // End performance measurement
            const duration = (endTime - startTime).toFixed(2);
            
            drawGrid(); // Final draw to ensure path is visible
            
            if (found) {
                 document.getElementById('statusMessage').textContent = `Path Found (Diagonal)! Time: ${duration}ms, Nodes Explored: ${nodesExplored}`;
            } else {
                 document.getElementById('statusMessage').textContent = `No Path Possible. Time: ${duration}ms, Nodes Explored: ${nodesExplored}`;
            }
            
            return found; 
        }

        async function startAStar() {
            if (isRunning) return;
            document.getElementById('runButton').disabled = true;
            isRunning = true;
            
            if (!startNode || !endNode) {
                document.getElementById('statusMessage').textContent = 'Error: Set both Start (S) and End (E) nodes.';
                document.getElementById('runButton').disabled = false;
                isRunning = false;
                return;
            }

            // Clear previous path/visited state
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const node = grid[r][c];
                    node.visited = false;
                    node.inPath = false;
                }
            }
            drawGrid();

            document.getElementById('statusMessage').textContent = 'Searching...';
            await aStar(startNode, endNode);
            
            isRunning = false;
            // Keep button disabled to prevent re-running without a reset
        }
    </script>
</body>
</html>
